name: "Publish"

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Build
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # trusted publishing (OIDC); no PyPI token is stored in the repo
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - name: Publish
        run: uv publish

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub release from changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="Release ${TAG}"

          if gh release view "$TAG" --json url &>/dev/null; then
            echo "Release for $TAG already exists; skipping."
            exit 0
          fi

          NOTES=""
          if [ -f CHANGELOG.md ]; then
            VERSION="${TAG#v}"
            NOTES="$(awk -v ver="$VERSION" '
              BEGIN { heading = "## [" ver "]" }
              index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) ~ /[[:space:]]/) { emit = 1; next }
              emit && /^## / { exit }
              emit && $0 ~ /^\[[0-9A-Za-z.-]+\]: https?:\/\// { exit }
              emit { print }
            ' CHANGELOG.md)"
          fi

          nonempty() {
            [ -n "$(printf '%s' "$1" | tr -d '[:space:]')" ]
          }

          if ! nonempty "$NOTES" && [ "$(git cat-file -t "$TAG" 2>/dev/null || true)" = tag ]; then
            NOTES="$(git tag -l --format='%(contents)' "$TAG" |
              sed '/^-----BEGIN PGP SIGNATURE-----$/,/^-----END PGP SIGNATURE-----$/d')"
          fi

          if nonempty "$NOTES"; then
            printf '%s\n' "$NOTES" | gh release create "$TAG" --title "$TITLE" --verify-tag --notes-file -
          else
            gh release create "$TAG" --title "$TITLE" --verify-tag --generate-notes
          fi
